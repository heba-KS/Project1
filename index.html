<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings - Payment</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body {
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background: linear-gradient(135deg, #8fb8f0 0%, #7c8ef0 50%, #7b5ce8 100%);
    min-height: 100vh;
  }

  .settings-card {
    background-color: #fff;
    border-radius: 10px;
    max-width: 720px;
    margin: 3rem auto;
    padding: 2.5rem 3rem 3rem;
    box-shadow: 0 25px 60px rgba(30, 20, 80, 0.25);
  }

  .settings-title {
    font-weight: 600;
    text-align: center;
    color: #2b2b3c;
  }

  .settings-subtitle {
    text-align: center;
    font-weight: 600;
    color: #2b2b3c;
    margin-bottom: 2rem;
  }

  .section-label {
    font-weight: 700;
    color: #2b2b3c;
    margin-bottom: 1rem;
  }

  .field-group {
    position: relative;
    margin-bottom: 0;
  }

  .field-group .field-tag {
    position: absolute;
    top: -0.6rem;
    left: 0.8rem;
    background: #fff;
    padding: 0 0.4rem;
    font-size: 0.8rem;
    color: #8a8a99;
  }

  .field-group .form-control {
    border-radius: 6px;
    border: 1px solid #d9d9e3;
    padding: 0.85rem 1rem;
    font-size: 1.05rem;
    color: #2b2b3c;
  }

  .field-group .form-control:focus {
    box-shadow: none;
    border-color: #7b5ce8;
  }

  .card-row {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-bottom: 1.5rem;
  }

  .card-logo {
    width: 52px;
    height: 34px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: none;
  }

  .mc-logo {
    background: #fff;
    position: relative;
  }
  .mc-logo .circle {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    position: absolute;
  }
  .mc-logo .red { background: #eb001b; left: 8px; }
  .mc-logo .orange { background: #f79e1b; left: 20px; opacity: 0.85; }

  .visa-logo {
    background: #1a1f71;
    color: #fff;
    font-weight: 700;
    font-style: italic;
    font-size: 0.95rem;
    letter-spacing: 0.5px;
  }

  .remove-link {
    color: #4b4bd6;
    text-decoration: none;
    font-weight: 500;
    white-space: nowrap;
    margin-left: 1rem;
  }
  .remove-link:hover {
    text-decoration: underline;
    color: #3737b0;
  }

  .add-card-title {
    font-weight: 700;
    color: #2b2b3c;
    margin: 2rem 0 1rem;
  }

  .btn-add-card {
    background-color: #16a34a;
    border: none;
    color: #fff;
    font-weight: 600;
    letter-spacing: 0.5px;
    padding: 0.85rem;
    border-radius: 6px;
    width: 100%;
  }

  .btn-add-card:hover {
    background-color: #128a3e;
    color: #fff;
  }
</style>
</head>
<body>

<div class="settings-card">

  <h1 class="settings-title">Settings</h1>
  <p class="settings-subtitle">Payment</p>

  <p class="section-label">Saved cards:</p>

  <!-- Mastercard row -->
  <div class="card-row">
    <div class="card-logo mc-logo">
      <div class="circle red"></div>
      <div class="circle orange"></div>
    </div>
    <div class="field-group flex-grow-1">
      <span class="field-tag">Card Number</span>
      <input type="text" class="form-control" value="**** **** **** 3193" readonly>
    </div>
    <a href="#" class="remove-link">Remove card</a>
  </div>

  <!-- Visa row -->
  <div class="card-row">
    <div class="card-logo visa-logo">VISA</div>
    <div class="field-group flex-grow-1">
      <span class="field-tag">Card Number</span>
      <input type="text" class="form-control" value="**** **** **** 4296" readonly>
    </div>
    <a href="#" class="remove-link">Remove card</a>
  </div>

  <p class="add-card-title">Add new card:</p>

  <form>
    <div class="field-group mb-4">
      <span class="field-tag">Cardholder's Name</span>
      <input type="text" class="form-control" placeholder="Heba Kasasbeh">
    </div>

    <div class="row g-3 mb-4">
      <div class="col-md-6">
        <div class="field-group">
          <span class="field-tag">Card Number</span>
          <input type="text" class="form-control" placeholder="1234 5678 1234 5678">
        </div>
      </div>
      <div class="col-md-3 col-6">
        <div class="field-group">
          <span class="field-tag">Expire</span>
          <input type="text" class="form-control" placeholder="MM/YY">
        </div>
      </div>
      <div class="col-md-3 col-6">
        <div class="field-group">
          <span class="field-tag">Cvv</span>
          <input type="text" class="form-control" placeholder="***">
        </div>
      </div>
    </div>

    <button type="submit" class="btn btn-add-card">ADD CARD</button>
  </form>

</div>

</body>
</html>
